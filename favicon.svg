<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
<style>#dark{display:none}@media (prefers-color-scheme: dark){#light{display:none}#dark{display:inline}}</style>
<image id="light" href="data:image/png;base64," width="128" height="128"/>
<mask id="m" style="mask-type:alpha"><image href="data:image/png;base64," width="128" height="128"/></mask>
<rect id="dark" width="128" height="128" fill="#FFFFFF" mask="url(#m)"/>
</svg>
